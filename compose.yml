services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: modelmaestro
      POSTGRES_USER: modelmaestro
      POSTGRES_PASSWORD: modelmaestro
    ports:
      - "5432:5432"
    volumes:
      - modelmaestro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelmaestro -d modelmaestro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modelmaestro-postgres:

